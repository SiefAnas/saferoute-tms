# Local development database only. Not a production topology.
# Usage: docker compose up -d db   →   Postgres 16 on localhost:5432
services:
  db:
    image: postgres:16
    container_name: saferoute-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: saferoute
      POSTGRES_PASSWORD: saferoute
      POSTGRES_DB: saferoute_dev
    ports:
      - "5432:5432"
    volumes:
      - saferoute_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saferoute -d saferoute_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  saferoute_pgdata:
